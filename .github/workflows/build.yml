name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Loop timing test
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse build/HardInsertPortTest_artefacts -Filter HardInsertPortTest.exe | Select-Object -First 1
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect plugins
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse build/HardInsert_artefacts/Release/VST3/Hard-Insert.vst3 dist/
          Copy-Item build/HardInsert_artefacts/Release/CLAP/Hard-Insert.clap dist/
          Get-ChildItem -Recurse dist | Select-Object FullName

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: Hard-Insert-windows-x64
          path: dist/
          if-no-files-found: error
